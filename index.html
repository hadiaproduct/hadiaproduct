<!DOCTYPE html>
<html lang="bn" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>হাদিয়া প্রোডাক্ট | Hadia Product</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    // ✅ EmailJS Init — আপনার Public Key এখানে সেট করা আছে
    (function(){
      if(typeof emailjs !== 'undefined') {
        emailjs.init({ publicKey: 'P3HrHxWkgd2INURfd' });
      }
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ✅ Supabase Config
    const SUPABASE_URL = 'https://ahxfjacozfnwinqkhhwx.supabase.co';
    // ⚠️ আপনার আগের ফাইলের সম্পূর্ণ Supabase Key-টি নিচের লাইনে বসিয়ে নিবেন
    const SUPABASE_KEY = 'YOUR_SUPABASE_KEY_HERE'; 
  </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-emerald-600 flex items-center gap-2">
        <i class="fa-solid fa-bag-shopping"></i> হাদিয়া প্রোডাক্ট
      </h1>
      <button onclick="toggleCartDrawer()" class="relative p-2 text-gray-600 hover:text-emerald-600 transition">
        <i class="fa-solid fa-cart-shopping text-2xl"></i>
        <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <h2 class="text-xl font-bold mb-6 text-gray-700 flex items-center gap-2">
      <span class="w-2 h-6 bg-emerald-500 rounded-full"></span> আমাদের পণ্যসমূহ
    </h2>
    
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      </div>
  </main>

  <div id="cartDrawer" class="fixed inset-0 z-50 overflow-hidden hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50 transition-opacity" onclick="toggleCartDrawer()"></div>
    <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
      <div class="w-screen max-w-md bg-white shadow-xl flex flex-col">
        <div class="px-4 py-6 bg-emerald-600 text-white flex items-center justify-between">
          <h2 class="text-lg font-bold"><i class="fa-solid fa-cart-shopping mr-2"></i> আপনার কার্ট</h2>
          <button onclick="toggleCartDrawer()" class="text-white hover:text-gray-200 text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-4" id="cartItemsList">
          <p class="text-gray-500 text-center py-8">আপনার কার্টটি এখন খালি আছে।</p>
        </div>

        <div class="border-t border-gray-200 p-4 bg-gray-50">
          <div class="flex justify-between text-base font-bold text-gray-900 mb-4">
            <p>মোট টাকা:</p>
            <p><span id="cartTotal">0</span> টাকা</p>
          </div>
          
          <div id="checkoutForm" class="space-y-3 mb-4 hidden">
            <h3 class="text-sm font-bold text-gray-700 border-b pb-1">ডেলিভারি তথ্য দিন:</h3>
            <div>
              <label class="block text-xs font-medium text-gray-600">আপনার নাম *</label>
              <input type="text" id="custName" class="w-full mt-1 p-2 border rounded text-sm focus:outline-emerald-500" placeholder="যেমন: আব্দুল করিম" required>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600">মোবাইল নাম্বার *</label>
              <input type="tel" id="custPhone" class="w-full mt-1 p-2 border rounded text-sm focus:outline-emerald-500" placeholder="01XXXXXXXXX" required>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600">পূর্ণাঙ্গ ঠিকানা *</label>
              <textarea id="custAddress" rows="2" class="w-full mt-1 p-2 border rounded text-sm focus:outline-emerald-500" placeholder="গ্রাম/রোড, থানা, জেলা" required></textarea>
            </div>
          </div>

          <button onclick="handleCheckoutOrder()" id="actionBtn" class="w-full bg-emerald-600 text-white py-3 px-4 rounded-md font-medium hover:bg-emerald-700 transition shadow-md">
            অর্ডার করতে এগিয়ে যান
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // আপনার ৩০টি প্রোডাক্টের ডাটা স্ট্রাকচার
    window.PRODUCTS_DATA = window.PRODUCTS_DATA || [];
    if(PRODUCTS_DATA.length === 0){
      for(let i=1; i<=30; i++){
        PRODUCTS_DATA.push({
          id: i,
          nm: `Product ${i}`,
          cat: 'অন্যান্য',
          pr: 1000 + (i * 50),
          old: 1200 + (i * 50),
          stk: 50,
          desc: 'এখানে আপনার আকর্ষণীয় পণ্যের বিস্তারিত বিবরণ থাকবে।',
          imgs: [`https://via.placeholder.com/300?text=Product+${i}`],
          keywords: ["gadget", "electronics"]
        });
      }
    }

    // কার্ট ভ্যারিয়েবল
    let cart = [];

    // প্রোডাক্ট পেজে প্রদর্শন করা
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      PRODUCTS_DATA.forEach(prod => {
        grid.innerHTML += `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
            <img src="${prod.imgs[0]}" alt="${prod.nm}" class="w-full h-48 object-cover">
            <div class="p-4">
              <span class="text-xs font-bold text-emerald-600 uppercase tracking-wide">${prod.cat}</span>
              <h3 class="font-bold text-gray-800 text-lg mt-1">${prod.nm}</h3>
              <div class="flex items-center gap-2 mt-2">
                <span class="text-emerald-600 font-extrabold text-lg">${prod.pr} ৳</span>
                <span class="text-gray-400 line-through text-sm">${prod.old} ৳</span>
              </div>
              <button onclick="addToCart(${prod.id})" class="w-full mt-4 bg-emerald-50 text-emerald-600 font-bold py-2 px-4 rounded-lg hover:bg-emerald-600 hover:text-white transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-cart-plus"></i> কার্টে রাখুন
              </button>
            </div>
          </div>
        `;
      });
    }

    // কার্ট ওপেন/ক্লোজ করা
    function toggleCartDrawer() {
      const drawer = document.getElementById('cartDrawer');
      drawer.classList.toggle('hidden');
    }

    // কার্টে প্রোডাক্ট যোগ করা
    function addToCart(id) {
      const product = PRODUCTS_DATA.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);
      
      if(existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
      // প্রোডাক্ট যোগ হলে অটোমেটিক কার্ট ওপেন হবে দেখার জন্য
      document.getElementById('cartDrawer').classList.remove('hidden');
    }

    // কার্ট থেকে বাদ দেওয়া
    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      updateCartUI();
    }

    // কার্টের পরিমাণ পরিবর্তন করা
    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if(item) {
        item.qty += delta;
        if(item.qty <= 0) {
          removeFromCart(id);
          return;
        }
      }
      updateCartUI();
    }

    // কার্ট আপডেট করা
    function updateCartUI() {
      const countEl = document.getElementById('cartCount');
      const listEl = document.getElementById('cartItemsList');
      const totalEl = document.getElementById('cartTotal');
      
      let totalQty = 0;
      let totalPrice = 0;
      
      if(cart.length === 0) {
        listEl.innerHTML = `<p class="text-gray-500 text-center py-8">আপনার কার্টটি এখন খালি আছে।</p>`;
        document.getElementById('checkoutForm').classList.add('hidden');
        document.getElementById('actionBtn').innerText = 'অর্ডার করতে এগিয়ে যান';
      } else {
        listEl.innerHTML = '';
        cart.forEach(item => {
          totalQty += item.qty;
          totalPrice += (item.pr * item.qty);
          
          listEl.innerHTML += `
            <div class="flex items-center gap-4 bg-gray-50 p-3 rounded-lg border border-gray-100">
              <img src="${item.imgs[0]}" class="w-16 h-16 object-cover rounded-md bg-white">
              <div class="flex-1">
                <h4 class="font-bold text-sm text-gray-800">${item.nm}</h4>
                <p class="text-xs text-emerald-600 font-bold mt-1">${item.pr} ৳</p>
                <div class="flex items-center gap-2 mt-2">
                  <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-white border rounded text-xs hover:bg-gray-100 font-bold">-</button>
                  <span class="text-sm font-bold w-6 text-center">${item.qty}</span>
                  <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-white border rounded text-xs hover:bg-gray-100 font-bold">+</button>
                </div>
              </div>
              <button onclick="removeFromCart(${item.id})" class="text-red-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          `;
        });
      }
      
      countEl.innerText = totalQty;
      totalEl.innerText = totalPrice;
    }

    // অর্ডার হ্যান্ডেলিং বাটন (পরবর্তী ধাপ / কনফার্ম অর্ডার)
    function handleCheckoutOrder() {
      if(cart.length === 0) {
        alert('অনুগ্রহ করে প্রথমে কার্টে পণ্য যোগ করুন।');
        return;
      }

      const form = document.getElementById('checkoutForm');
      const btn = document.getElementById('actionBtn');

      // প্রথম ক্লিকে ফরম দেখাবে
      if(form.classList.contains('hidden')) {
        form.classList.remove('hidden');
        btn.innerText = 'অর্ডার নিশ্চিত করুন';
        return;
      }

      // দ্বিতীয় ক্লিকে ভ্যালিডেশন এবং ইমেইল যাবে
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();

      if(!name || !phone || !address) {
        alert('অনুগ্রহ করে নাম, মোবাইল নাম্বার এবং সম্পূর্ণ ঠিকানা সঠিকভাবে লিখুন।');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'অর্ডার প্রসেস হচ্ছে...';

      // ১. অটোমেটিক ইউনিক অর্ডার আইডি তৈরি
      const uniqueOrderID = 'HP-' + Date.now().toString().slice(-6);

      // ২. পণ্যের বিবরণ সুন্দর টেক্সট ফরম্যাটে রূপান্তর করা
      let productDetailsText = '';
      let index = 1;
      cart.forEach(item => {
        productDetailsText += `${index}. ${item.nm} (পরিমাণ: ${item.qty} টি) - মূল্য: ${item.pr * item.qty} টাকা\n`;
        index++;
      });

      // মোট টাকা হিসাব
      const finalTotal = document.getElementById('cartTotal').innerText;

      // ৩. 🎯 আপনার EmailJS টেমপ্লেটের সাথে ভ্যারিয়েবলগুলোর ম্যাপিং (যা আগে ভুল ছিল)
      const emailTemplateParams = {
        order_id: uniqueOrderID,            // টেমপ্লেটের {{order_id}} এ বসবে
        customer_name: name,                // টেমপ্লেটের {{customer_name}} এ বসবে
        customer_phone: phone,              // টেমপ্লেটের {{customer_phone}} এ বসবে
        delivery_address: address,          // টেমপ্লেটের {{delivery_address}} এ বসবে
        product_details: productDetailsText,// টেমপ্লেটের {{product_details}} এ বসবে
        total_amount: finalTotal            // টেমপ্লেটের {{total_amount}} এ বসবে
      };

      // ৪. EmailJS-এর মাধ্যমে ইমেইল পাঠানো
      // ⚠️ 'YOUR_SERVICE_ID' এবং 'YOUR_TEMPLATE_ID' এর জায়গায় আপনার নিজস্ব আইডি দুটি বসিয়ে দিন।
      emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', emailTemplateParams)
        .then(function(response) {
          alert('ধন্যবাদ! আপনার অর্ডারটি সফলভাবে সম্পন্ন হয়েছে এবং ইমেইল পাঠানো হয়েছে।');
          
          // অর্ডার সফল হলে কার্ট খালি করা এবং রিমুভ করা
          cart = [];
          updateCartUI();
          document.getElementById('custName').value = '';
          document.getElementById('custPhone').value = '';
          document.getElementById('custAddress').value = '';
          toggleCartDrawer();
          
          btn.disabled = false;
        }, function(error) {
          console.error('EmailJS Error:', error);
          alert('দুঃখিত, ইমেইল পাঠাতে সমস্যা হয়েছে। তবে অর্ডার রিকোয়েস্ট গ্রহণ করা হয়েছে।');
          btn.disabled = false;
          btn.innerText = 'অর্ডার নিশ্চিত করুন';
        });
    }

    // পেজ লোড হলে প্রোডাক্টগুলো দেখানোর জন্য রান করা হলো
    window.onload = renderProducts;
  </script>
</body>
</html>
